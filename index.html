#deck{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:9999;display:flex;flex-wrap:nowrap;gap:2px;justify-content:center;background:rgba(0,24,48,.9);padding:6px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.35);font-family:Saira,system-ui,sans-serif;max-width:calc(100vw - 32px)}
#deck button{white-space:nowrap;font:600 13px Saira,system-ui,sans-serif;color:#DDE7F3;background:transparent;border:0;border-radius:999px;padding:8px 12px;min-height:38px;cursor:pointer}
#deck button:hover{color:#FFFFFF;background:rgba(255,255,255,.1)}
#deck button[aria-current="page"]{background:#EB881C;color:#002447}
#deck button.ghost{color:#9FB2C8}
#deck.min button:not(.ghost){display:none}
#deck.min{opacity:.35}
#deck{display:none!important}

[data-anim="letras"] .w{display:inline-block;white-space:nowrap}
[data-anim="letras"] .l{display:inline-block;opacity:0;transform:translateY(.6em) skewX(-10deg);filter:blur(6px);transition:opacity .45s ease,transform .7s cubic-bezier(.2,.8,.2,1),filter .5s ease;transition-delay:calc(var(--i) * 26ms)}
[data-anim="letras"][data-rt-in] .l{opacity:1;transform:none;filter:none}
[data-anim="sube"]{opacity:0;transform:translateY(26px);transition:opacity .8s ease .25s,transform .9s cubic-bezier(.2,.8,.2,1) .25s}
[data-anim="sube"][data-rt-in]{opacity:1;transform:none}
@media (prefers-reduced-motion: reduce){[data-anim] .l,[data-anim]{opacity:1!important;transform:none!important;filter:none!important;transition:none!important}}

@media (max-width: 760px){
html.es-movil body{margin:0;background:#002447}
#deck{bottom:10px;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;max-width:calc(100vw - 20px)}
#deck button{font-size:12px;padding:6px 10px;min-height:36px}
#deck.min{left:auto;right:12px;transform:none;opacity:.92}
#deck.min button.ghost{background:#EB881C;color:#002447}
html.es-movil [data-flota]{position:fixed!important;top:auto!important;left:auto!important;right:16px!important;bottom:18px;z-index:9998;opacity:0;transform:translateY(16px) scale(.85);pointer-events:none;transition:opacity .35s ease,transform .45s cubic-bezier(.2,.8,.2,1)}
html.es-movil.pasa-hero [data-flota]{opacity:1;transform:none;pointer-events:auto}
}

    window.scrollTo(0, 0);
    var btns = document.querySelectorAll('#deck button[data-k]');
    for (var i = 0; i < btns.length; i++) btns[i].setAttribute('aria-current', btns[i].getAttribute('data-k') === key ? 'page' : 'false');
  }

  document.addEventListener('click', function (e) {
    var t = e.target;
    while (t && t !== document) {
      if (t.__click) { t.__click(e); break; }
      t = t.parentNode;
    }
    var a = e.target.closest ? e.target.closest('a[href]') : null;
    if (!a) return;
    var href = a.getAttribute('href');
    var m = href.match(/^([A-Za-z]+)\.dc\.html$/);
    if (m) { e.preventDefault(); show(m[1]); }
    else if (href === '#') e.preventDefault();
  });

  // Barra para presentar
  var deck = document.getElementById('deck');
  ORDER.forEach(function (o, i) {
    var b = document.createElement('button');
    b.type = 'button'; b.setAttribute('data-k', o[0]);
    b.textContent = (i + 1) + ' · ' + o[1];
    b.addEventListener('click', function () { show(o[0]); });
    deck.appendChild(b);
  });
  var hideBtn = document.createElement('button');
  hideBtn.type = 'button'; hideBtn.textContent = 'Ocultar (H)'; hideBtn.className = 'ghost';
  hideBtn.addEventListener('click', function () { deck.classList.toggle('min'); if (MOBILE) hideBtn.textContent = deck.classList.contains('min') ? 'Pantallas' : 'Cerrar'; });
  if (MOBILE) { deck.classList.add('min'); hideBtn.textContent = 'Pantallas'; }
  deck.appendChild(hideBtn);
  document.addEventListener('keydown', function (e) {
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
    if (e.key >= '1' && e.key <= '6') show(ORDER[Number(e.key) - 1][0]);
    if (e.key === 'h' || e.key === 'H') deck.classList.toggle('min');
  });

  // Fotos: si falta un archivo en la carpeta fotos, se muestra el fondo azul en su lugar
  var srcs = {};
  Object.keys(PAGES).forEach(function (k) {
    (PAGES[k].tpl.match(/src="(fotos\/[^"]+)"/g) || []).forEach(function (s) { srcs[s.slice(5, -1)] = 1; });
  });
  var pending = Object.keys(srcs).length;
  Object.keys(srcs).forEach(function (s) {
    var im = new Image();
    im.onload = function () { if (--pending === 0) show(current); };
    im.onerror = function () { MISSING[s] = 1; if (--pending === 0) show(current); };
    im.src = s;
  });

    var mq = window.matchMedia('(max-width: 760px)');
  var onMq = function () { var was = MOBILE; MOBILE = mq.matches; document.documentElement.classList.toggle('es-movil', MOBILE); if (was !== MOBILE) show(current === 'Movil' || current === 'Main' ? 'Main' : current); };
  if (mq.addEventListener) mq.addEventListener('change', onMq); else if (mq.addListener) mq.addListener(onMq);
  var onScroll = function () { var v = document.getElementById('movVid'); var past = false; if (v) { var r = v.parentNode.getBoundingClientRect(); past = r.bottom < window.innerHeight * 0.35; } document.documentElement.classList.toggle('pasa-hero', past); };
  var autoMute = function () { var v = document.getElementById('heroVid') || document.getElementById('movVid'); if (!v || v.muted) return; var r = v.getBoundingClientRect(); var vis = Math.max(0, Math.min(r.bottom, window.innerHeight) - Math.max(r.top, 0)); if (vis < r.height * 0.2) { v.muted = true; if (comps[current]) comps[current].setState({ sound: false }); } };
  window.addEventListener('scroll', function () { onScroll(); autoMute(); }, { passive: true });
  show('Main'); onScroll();
})();

</script>
</body>
